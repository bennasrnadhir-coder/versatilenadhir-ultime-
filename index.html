<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NADHIR — PROTOCOLE ÉLITE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060810;--bg2:#0b0e16;--bg3:#10141f;
  --glass:rgba(255,255,255,0.028);--glass2:rgba(255,255,255,0.055);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --g:#00e676;--g2:#00c853;--g3:rgba(0,230,118,0.12);
  --a:#ffb300;--a2:#ff8f00;--a3:rgba(255,179,0,0.12);
  --r:#ff4444;--r3:rgba(255,68,68,0.12);
  --b:#40c4ff;--b3:rgba(64,196,255,0.12);
  --p:#ce93d8;
  --t:#e2e8f0;--t2:#7a8fa0;--t3:#384858;--t4:#1e2a38;
  --glow-g:0 0 20px rgba(0,230,118,0.3);
  --glow-a:0 0 20px rgba(255,179,0,0.3);
  --glow-r:0 0 20px rgba(255,68,68,0.3);
  --r-card:18px;--r-sm:10px;
  --nav-h:68px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;color:var(--t);-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 20% 10%,rgba(0,230,118,0.04) 0%,transparent 60%),
  radial-gradient(ellipse 50% 60% at 80% 85%,rgba(255,179,0,0.035) 0%,transparent 60%),
  radial-gradient(ellipse 40% 30% at 65% 25%,rgba(64,196,255,0.02) 0%,transparent 55%);}

#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}

/* ── TOPBAR ── */
#topbar{flex-shrink:0;height:58px;background:rgba(6,8,16,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;gap:8px;}
.logo-wrap .logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;
  background:linear-gradient(90deg,var(--g),var(--a));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.logo-wrap .logo-sub{font-size:8px;color:var(--t3);letter-spacing:3px;display:block;margin-top:-3px;}
.top-chips{display:flex;gap:6px;align-items:center;}
.top-chip{display:flex;align-items:center;gap:5px;background:var(--glass2);
  border:1px solid var(--border);border-radius:20px;padding:5px 10px;cursor:pointer;transition:all .2s;}
.top-chip:hover{border-color:var(--g);}
.tc-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);}
.tc-dot.green{background:var(--g);animation:pulse 2s infinite;}
.tc-dot.amber{background:var(--a);}
.tc-dot.red{background:var(--r);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
.tc-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);}

/* ── NAV ── */
#nav{flex-shrink:0;height:var(--nav-h);background:rgba(6,8,16,0.97);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;
  padding-bottom:env(safe-area-inset-bottom);}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;
  border-radius:10px;cursor:pointer;border:none;background:transparent;
  color:var(--t3);font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.3px;
  transition:all .2s;min-width:48px;}
.nb .ni{font-size:19px;line-height:1;transition:all .2s;}
.nb:hover{color:var(--t2);}
.nb.active{color:var(--g);}
.nb.active .ni{filter:drop-shadow(0 0 5px var(--g));}

/* ── MAIN ── */
#main{flex:1 1 0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;}
.tab{display:none;padding:14px 14px 110px;animation:fin .28s ease;}
.tab.active{display:block;}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── CARDS ── */
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;margin-bottom:12px;backdrop-filter:blur(10px);position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);}
.card.cg{border-color:rgba(0,230,118,0.2);background:linear-gradient(135deg,rgba(0,230,118,0.05),rgba(0,0,0,0));}
.card.ca{border-color:rgba(255,179,0,0.2);background:linear-gradient(135deg,rgba(255,179,0,0.05),rgba(0,0,0,0));}
.card.cb{border-color:rgba(64,196,255,0.2);background:linear-gradient(135deg,rgba(64,196,255,0.05),rgba(0,0,0,0));}
.card.cr{border-color:rgba(255,68,68,0.2);background:linear-gradient(135deg,rgba(255,68,68,0.05),rgba(0,0,0,0));}
.ct{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2.5px;color:var(--a);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ct .ico{font-size:16px;}

/* ── OBJECTIF CARDS ── */
.obj-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px;}
.obj-card{border-radius:14px;padding:14px 16px;border:1px solid;position:relative;overflow:hidden;}
.obj-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  border-radius:50%;opacity:.15;pointer-events:none;}
.obj-sprint{background:linear-gradient(135deg,rgba(0,230,118,0.1),rgba(0,230,118,0.03));
  border-color:rgba(0,230,118,0.3);}
.obj-sprint::before{background:var(--g);}
.obj-detente{background:linear-gradient(135deg,rgba(255,179,0,0.1),rgba(255,179,0,0.03));
  border-color:rgba(255,179,0,0.3);}
.obj-detente::before{background:var(--a);}
.obj-bd{background:linear-gradient(135deg,rgba(255,68,68,0.1),rgba(255,68,68,0.03));
  border-color:rgba(255,68,68,0.3);}
.obj-bd::before{background:var(--r);}
.obj-label{font-size:9px;letter-spacing:2px;opacity:.7;margin-bottom:3px;}
.obj-value{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;line-height:1;}
.obj-current{font-size:10px;opacity:.6;margin-top:3px;}
.obj-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:10px;margin-top:8px;overflow:hidden;}
.obj-fill{height:100%;border-radius:10px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

/* ── STATS GRID ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.sg3{grid-template-columns:1fr 1fr 1fr;}
.sb{background:var(--glass2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.sv{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--g);font-weight:700;line-height:1;}
.sl{font-size:9px;color:var(--t2);margin-top:4px;letter-spacing:.5px;}
.ss{font-size:9px;color:var(--t3);margin-top:2px;}

/* ── PROGRESS BAR ── */
.pb-wrap{margin:6px 0;}
.pb-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--t2);margin-bottom:4px;}
.pb-track{height:5px;background:rgba(255,255,255,0.05);border-radius:10px;overflow:hidden;}
.pb-fill{height:100%;border-radius:10px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}
.pf-g{background:linear-gradient(90deg,var(--g2),var(--g));}
.pf-a{background:linear-gradient(90deg,var(--a2),var(--a));}
.pf-b{background:linear-gradient(90deg,#0091ea,var(--b));}
.pf-r{background:linear-gradient(90deg,#c62828,var(--r));}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;
  font-size:9px;font-weight:700;letter-spacing:.5px;}
.bg{background:rgba(0,230,118,.12);color:var(--g);border:1px solid rgba(0,230,118,.2);}
.ba{background:rgba(255,179,0,.12);color:var(--a);border:1px solid rgba(255,179,0,.2);}
.br{background:rgba(255,68,68,.12);color:var(--r);border:1px solid rgba(255,68,68,.2);}
.bb{background:rgba(64,196,255,.12);color:var(--b);border:1px solid rgba(64,196,255,.2);}
.bdim{background:var(--glass2);color:var(--t3);border:1px solid var(--border);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;
  border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  transition:all .2s;white-space:nowrap;}
.btn-g{background:linear-gradient(135deg,var(--g2),var(--g));color:#000;box-shadow:0 3px 12px rgba(0,230,118,.25);}
.btn-g:active{transform:scale(.97);}
.btn-a{background:linear-gradient(135deg,var(--a2),var(--a));color:#000;}
.btn-r{background:linear-gradient(135deg,#c62828,var(--r));color:#fff;}
.btn-b{background:linear-gradient(135deg,#0091ea,var(--b));color:#000;}
.btn-o{background:transparent;color:var(--t);border:1px solid var(--border);}
.btn-o:hover{border-color:var(--g);color:var(--g);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:8px;}
.btn-full{width:100%;justify-content:center;margin-bottom:7px;}

/* ── INPUTS ── */
.ig{margin-bottom:11px;}
.il{font-size:10px;color:var(--t2);margin-bottom:4px;display:block;letter-spacing:.5px;}
.inp{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:9px;padding:9px 12px;color:var(--t);font-family:'DM Sans',sans-serif;
  font-size:13px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(0,230,118,.1);}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
select.inp option{background:var(--bg2);}

/* ── SNC STATUS ── */
.snc-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;
  margin-bottom:10px;border:1px solid;font-size:11px;font-weight:600;}
.snc-ok{background:rgba(0,230,118,.07);border-color:rgba(0,230,118,.3);color:var(--g);}
.snc-warn{background:rgba(255,179,0,.07);border-color:rgba(255,179,0,.3);color:var(--a);}
.snc-bad{background:rgba(255,68,68,.07);border-color:rgba(255,68,68,.3);color:var(--r);}
.snc-none{background:rgba(255,255,255,.03);border-color:var(--border);color:var(--t3);}

/* ── EX LIST ── */
.ex-item{display:flex;justify-content:space-between;align-items:flex-start;
  padding:9px 0;border-bottom:1px solid var(--border);}
.ex-item:last-child{border-bottom:none;}
.ex-name{font-size:12px;font-weight:500;flex:1;padding-right:10px;}
.ex-det{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
  color:var(--a);white-space:nowrap;}
.ex-sub{font-size:9px;color:var(--t3);margin-top:2px;}
.ex-charge{font-size:10px;color:var(--g);margin-top:2px;font-family:'JetBrains Mono',monospace;}
.ex-ok{background:rgba(0,230,118,.04);border-radius:8px;padding:9px 8px;margin:2px -8px;}
.ex-reduced{background:rgba(255,179,0,.04);border-radius:8px;padding:9px 8px;margin:2px -8px;}
.ex-cancelled{opacity:.35;}

/* ── PHASE BADGE ── */
.phase-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;margin-bottom:10px;}
.pt-prep{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.3);color:var(--g);}
.pt-charge{background:rgba(255,179,0,.12);border:1px solid rgba(255,179,0,.3);color:var(--a);}
.pt-pic{background:rgba(255,68,68,.12);border:1px solid rgba(255,68,68,.3);color:var(--r);}
.pt-dech{background:rgba(100,100,100,.12);border:1px solid rgba(100,100,100,.3);color:var(--t3);}

/* ── MESO DOTS ── */
.meso-row{display:flex;gap:5px;align-items:center;margin:8px 0;}
.mdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;border:2px solid transparent;flex-shrink:0;}
.mdot.prep{background:rgba(0,230,118,.15);color:var(--g);border-color:rgba(0,230,118,.3);}
.mdot.charge{background:rgba(255,179,0,.15);color:var(--a);border-color:rgba(255,179,0,.3);}
.mdot.pic{background:rgba(255,68,68,.15);color:var(--r);border-color:rgba(255,68,68,.3);}
.mdot.dech{background:rgba(100,100,100,.12);color:var(--t3);border-color:rgba(100,100,100,.3);}
.mdot.cur{width:34px;height:34px;font-size:10px;font-weight:900;
  box-shadow:0 0 14px currentColor;animation:glow 2s infinite alternate;}
@keyframes glow{from{transform:scale(1)}to{transform:scale(1.09)}}

/* ── COACH MSG ── */
.cm{background:linear-gradient(135deg,rgba(0,230,118,.04),rgba(255,179,0,.02));
  border:1px solid rgba(0,230,118,.15);border-radius:12px;padding:13px;margin-bottom:10px;
  position:relative;}
.cm::before{content:'🤖';font-size:16px;position:absolute;top:-9px;left:12px;
  background:var(--bg2);padding:0 4px;}
.cm p{font-size:11px;line-height:1.8;color:var(--t);}
.cm-warn{background:rgba(255,179,0,.04);border-color:rgba(255,179,0,.2);}
.cm-warn::before{content:'💡';}
.cm-bad{background:rgba(255,68,68,.04);border-color:rgba(255,68,68,.2);}
.cm-bad::before{content:'⚠️';}

/* ── TIMER ── */
#timer-ov{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);
  z-index:200;display:none;place-items:center;animation:fin .2s;}
#timer-ov.show{display:grid;}
#timer-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;
  padding:32px 24px;text-align:center;min-width:260px;max-width:320px;width:90%;}
#t-lbl{font-size:9px;color:var(--t3);letter-spacing:2px;margin-bottom:4px;}
#t-ex{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;
  color:var(--a);margin-bottom:14px;line-height:1.2;}
#t-num{font-family:'JetBrains Mono',monospace;font-size:58px;color:var(--g);
  text-shadow:var(--glow-g);margin-bottom:10px;line-height:1;transition:color .3s;}
#t-num.urgent{color:var(--r);text-shadow:var(--glow-r);}
#t-prog{height:4px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden;margin-bottom:18px;}
#t-pf{height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:10px;transition:width 1s linear;}
.t-btns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
.t-quick{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
.tq{padding:5px 10px;border-radius:16px;font-size:10px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:var(--glass2);color:var(--t2);transition:all .15s;}
.tq:active{background:var(--g3);border-color:var(--g);color:var(--g);}

/* ── MODAL ── */
#modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.84);backdrop-filter:blur(8px);
  z-index:150;display:none;place-items:center;padding:16px;}
#modal-ov.show{display:grid;}
#modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);
  padding:22px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  animation:slideup .3s cubic-bezier(.4,0,.2,1);position:relative;}
#modal-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:3px;
  color:var(--a);margin-bottom:13px;}
#modal-close{position:absolute;top:18px;right:18px;background:var(--glass2);
  border:1px solid var(--border);border-radius:7px;padding:4px 8px;color:var(--t2);
  cursor:pointer;font-size:13px;}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ── NOTIF ── */
#notif{position:fixed;bottom:calc(var(--nav-h)+10px);left:12px;right:12px;max-width:420px;
  margin:0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:11px;
  padding:11px 14px;z-index:300;display:none;gap:9px;}
#notif.show{display:flex;align-items:center;}
#notif.success{border-color:rgba(0,230,118,.35);}
#notif.warn{border-color:rgba(255,179,0,.35);}
#notif.error{border-color:rgba(255,68,68,.35);}
#ni{font-size:18px;}#nt{flex:1;font-size:11px;line-height:1.5;}
@keyframes notifin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ── CLOUD POPUP ── */
#cloud-pop{position:fixed;top:62px;right:10px;width:300px;background:var(--bg2);
  border:1px solid rgba(64,196,255,.3);border-radius:var(--r-card);padding:16px;
  z-index:120;display:none;box-shadow:0 16px 50px rgba(0,0,0,.5);}
#cloud-pop.show{display:block;animation:slidedn .22s;}
@keyframes slidedn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.cloud-log-box{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--t2);
  max-height:70px;overflow-y:auto;margin-top:8px;line-height:1.7;}
.log-ok{color:var(--g);}.log-err{color:var(--r);}.log-info{color:var(--b);}

/* ── SNC POPUP ── */
#snc-pop{position:fixed;top:62px;right:10px;width:270px;background:var(--bg2);
  border:1px solid rgba(0,230,118,.3);border-radius:var(--r-card);padding:16px;
  z-index:120;display:none;box-shadow:0 16px 50px rgba(0,0,0,.5),var(--glow-g);}
#snc-pop.show{display:block;animation:slidedn .22s;}

/* ── CHART ── */
.chart-wrap{overflow-x:auto;}canvas{display:block;}

/* ── SLIDER ── */
input[type=range]{width:100%;-webkit-appearance:none;height:5px;
  background:rgba(255,255,255,.07);border-radius:10px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g));
  cursor:pointer;box-shadow:var(--glow-g);}
.slider-row{display:flex;align-items:center;gap:8px;}
.wk-badge{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--g);font-weight:700;
  min-width:32px;text-align:center;background:var(--glass2);border:1px solid var(--border);
  border-radius:7px;padding:3px 7px;}

/* ── CHECKLIST ── */
.chk-item{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s;}
.chk-item:last-child{border-bottom:none;}
.chk-box{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.chk-box.done{background:var(--g);border-color:var(--g);}
.chk-box.done::after{content:'✓';font-size:10px;color:#000;font-weight:700;}
.chk-label{font-size:12px;color:var(--t);transition:color .15s;}
.chk-item.done .chk-label{color:var(--t3);text-decoration:line-through;}

/* ── HR DIVIDER ── */
.hr{height:1px;background:var(--border);margin:10px 0;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--a);margin:10px 0 8px;}

/* ── WEEK NAV ── */
.wk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wk-label{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;}
.wk-sub{font-size:10px;color:var(--t2);margin-top:1px;}
.wk-btns{display:flex;gap:5px;}
.wk-btn{width:34px;height:34px;border-radius:8px;background:var(--glass2);
  border:1px solid var(--border);color:var(--t);cursor:pointer;font-size:14px;

function calcYrWk(){
  const startStr = (typeof S !== 'undefined' && S.profil && S.profil.startDate)
    ? S.profil.startDate
    : new Date().toISOString().split('T')[0];
  const start = new Date(startStr);
  start.setHours(0,0,0,0);
  const today = new Date();
  today.setHours(0,0,0,0);
  const diffDays = Math.max(0, Math.floor((today - start) / 86400000));
  const totalWeeks = Math.floor(diffDays / 7) + 1;
  const wk = Math.min(400, totalWeeks);
  const yr = Math.min(8, Math.ceil(wk / 52)) || 1;
  const mo = today.getMonth() + 1;
  const hivAuto = (mo >= 11 || mo <= 2);
  return { yr, wk, hivAuto };
}
function isAutoMode(){ return typeof S !== 'undefined' && S._manualYr === null && S._manualWk === null; }
function resetAuto(){
  S._manualYr = null; S._manualWk = null;
  DB.s('manualYr', null); DB.s('manualWk', null);
  const yw = calcYrWk();
  S.yr = yw.yr; S.wk = yw.wk;
  if(yw.hivAuto && S.mode !== 'hiv') S.mode = 'hiv';
  else if(!yw.hivAuto && S.mode === 'hiv') S.mode = 'std';
  save();
  notify('Mode AUTO — An '+S.yr+' · Sem. '+S.wk+(yw.hivAuto?' · ❄️':''), 'success');
  renderProfile(); renderToday();
}

    detente: TRAJECTOIRE.detente[y-1].cible,
    bd: TRAJECTOIRE.bd[y-1].cible,
  };
}

// Ajustement automatique des volumes selon écart performance
function getAdjustedVolumes(yr){
  const cible = getCibleAnnee(yr);
  const tests = S.tests || [];
  const lastSprint  = [...tests].reverse().find(t => t.sprint);
  const lastDetente = [...tests].reverse().find(t => t.detente);
  const lastBd      = [...tests].reverse().find(t => t.bd !== undefined);
  let adjSprint = 0, adjPlio = 0, adjBd = 0, adjForce = 0;
  // Sprint : si en retard → +15% volume Vmax, -10% force
  if(lastSprint && lastSprint.sprint > cible.sprint + 0.3){
    adjSprint = +1; adjForce = -1;
  } else if(lastSprint && lastSprint.sprint < cible.sprint - 0.3){
    adjSprint = -1;
  }
  // Détente : si en retard → +15% plio, +10% force explosive
  if(lastDetente && lastDetente.detente < cible.detente - 8){
    adjPlio = +1; adjForce = +1;
  } else if(lastDetente && lastDetente.detente > cible.detente + 5){
    adjPlio = -1;
  }
  // BD : si en retard → +1 séance BD hivernale
  if(lastBd && lastBd.bd < cible.bd - 20){
    adjBd = +1;
  }
  const macro = MACROS[yr-1];
  return {
    sprint:  Math.max(1, macro.sprintVol + adjSprint),
    plio:    Math.max(1, macro.plioVol + adjPlio),
    bd:      Math.max(1, macro.bdVol + adjBd),
    force:   Math.max(1, 3 + adjForce),
    message: [
      adjSprint > 0 ? '⚡ Volume sprint +15% (retard sur trajectoire)' : '',

      adjForce  < 0 ? '🏋️ Volume force -10% (sprint prioritaire)' : '',
      adjBd     > 0 ? '🤼 BD intensifié (retard vs frère)' : '',
    ].filter(Boolean),
  };
}

// ── SNC ENGINE ──
function sncMoy7(){
  const r=S.snc.slice(-7);
  if(!r.length) return null;
  return r.map(x=>(x.s1+x.s2+x.s3)/3).reduce((a,b)=>a+b,0)/r.length;
}
function sncToday(){ const d=S.snc.find(x=>x.date===td()); return d?(d.s1+d.s2+d.s3)/3:null; }
function sleepToday(){ const d=S.snc.find(x=>x.date===td()); return d?d.sleep:null; }
function sncRatio(){ const m=sncMoy7(),t=sncToday(); if(!m||!t) return null; return t/m; }

function sncDecision(){
  const ratio = sncRatio();
  const sleep = sleepToday();
  const reasons = [];
  if(ratio !== null && ratio < 0.85) reasons.push(`SNC ${Math.round(ratio*100)}% < 85%`);
  if(sleep !== null && sleep < 7.5) reasons.push(`Sommeil ${sleep}h < 7h30`);
  const warned = ratio !== null && ratio >= 0.85 && ratio < 0.90;
  return { ok: reasons.length===0, warned, reasons, ratio, sleep };
}

function sncBannerHTML(){
  const d = sncDecision();
  const ratio = d.ratio;
  if(ratio === null){
    return `<div class="snc-banner snc-none">❓ Test SNC non effectué aujourd'hui — tape sur <strong>SNC</strong> en haut</div>`;
  }
  if(!d.ok){
    return `<div class="snc-banner snc-bad">🚫 SÉANCE HAUTE INTENSITÉ ANNULÉE — ${d.reasons.join(' • ')}</div>`;
  }
  if(d.warned){
    return `<div class="snc-banner snc-warn">⚡ SNC BAS (${Math.round(ratio*100)}%) — Sprint & plio réduits −25%</div>`;
  }
  return `<div class="snc-banner snc-ok">✅ SNC ${Math.round(ratio*100)}% — ${ratio>=1?'OPTIMAL 🚀':'Bon niveau'}</div>`;
}

function adjustEx(ex, wk){
  const sw = ((wk-1)%8)+1;
  const d = sncDecision();
  const ratio = d.ratio ?? 1.0;
  const isDech = sw===8;

  if(isDech){
    if(ex.cat==='sprint'||ex.cat==='plio'){
      return {css:'ex-reduced', badge:'⚡ DÉCHARGE', note:'Volume −40%'};
    }
    if(ex.cat==='muscu'){
      return {css:'ex-reduced', badge:'⚡ DÉCHARGE', note:'Charge 65%'};
    }
  }
  if(!d.ok && (ex.cat==='sprint'||ex.cat==='plio')){
    return {css:'ex-cancelled', badge:'🚫 ANNULÉ', note:'SNC/sommeil insuffisant'};
  }
  if(d.warned && (ex.cat==='sprint'||ex.cat==='plio')){
    return {css:'ex-reduced', badge:'⚠️ RÉDUIT', note:`SNC ${Math.round(ratio*100)}% — volume −25%`};
  }
  if(ratio >= 1.0 && (ex.cat==='sprint'||ex.cat==='plio') && sw>=5 && sw<=7){
    return {css:'ex-ok', badge:'🚀 OPTIMAL', note:'SNC au top — volume max'};
  }
  return null;
}

// ── NUTRITION ──
function calcNutri(poids, intensite, sw){
  const isDech = sw===8;
  const isRest = intensite==='repos'||intensite==='basse';
  const isHigh = intensite==='haute';
  const prot = isDech ? poids*2.0 : (sw<=4 ? poids*2.2 : poids*2.0);
  const gMin = isRest||isDech ? 3.0 : (isHigh ? 5.0 : 4.0);
  const gMax = isRest||isDech ? 4.0 : (isHigh ? 7.0 : 5.5);
  const fat   = poids * (isRest ? 1.1 : 0.9);
  const cal   = prot*4 + (((gMin+gMax)/2)*poids)*4 + fat*9;
  return {
    prot: Math.round(prot*poids)/poids > 1 ? Math.round(prot) : Math.round(prot*poids),
    glucMin: Math.round(gMin*poids), glucMax: Math.round(gMax*poids),
    fat: Math.round(fat), cal: Math.round(cal),
    creatine: '5g/j dans eau (maintenance — obligatoire)',
    timing: isHigh ? 'J-1h30: riz+poulet. Post: 35g whey+banane' : 'Repas normaux — focus récupération'
  };
}

// ── AUTO CLOUD SYNC (debounce 5s) ──
function scheduleSync(){
  if(!S.jbKey || !S.jbBin) return;
  _syncPending = true;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(autoSync, 5000);
}

async function autoSync(){
  _syncPending = false;
  if(!S.jbKey || !S.jbBin) return;
  try{
    const payload = getPayload();
    const res = await fetch(`${JBURL}/b/${S.jbBin}`,{
      method:'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key':S.jbKey},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    showAutosave('cloud');
    cloudLog2('ok',`☁️ Auto-sync OK — ${new Date().toLocaleTimeString()}`);
    updateCloudDot('ok');
  }catch(e){
    cloudLog2('err',`✗ Auto-sync: ${e.message.slice(0,40)}`);
    updateCloudDot('err');
  }
}

function getPayload(){
  return {yr:S.yr,wk:S.wk,mode:S.mode,profil:S.profil,snc:S.snc,
    sessions:S.sessions,tests:S.tests,checklists:S.checklists,
    _v:'nadhir-elite-v1',_at:new Date().toISOString()};
}

function updateCloudDot(state){
  const dot = document.getElementById('cloud-dot');
  const val = document.getElementById('cloud-val');
  if(!dot||!val) return;
  if(state==='ok'){dot.style.background='var(--g)';val.textContent='✓';}
  else if(state==='err'){dot.style.background='var(--r)';val.textContent='✗';}
  else{dot.style.background='var(--b)';val.textContent='Sync';}
}

async function cloudSave(){
  const key=(document.getElementById('jb-key')?.value||'').trim();
  const bin=(document.getElementById('jb-bin')?.value||'').trim();
  if(!key){cloudLog2('err','❌ Clé API manquante');return;}
  cloudLog2('info','Sauvegarde…');
  updateCloudDot('sync');
  try{
    let url = bin ? `${JBURL}/b/${bin}` : `${JBURL}/b`;
    let method = bin ? 'PUT' : 'POST';
    const headers = {'Content-Type':'application/json','X-Master-Key':key};
    if(!bin){headers['X-Bin-Name']='nadhir-elite';headers['X-Bin-Private']='true';}
    const res = await fetch(url,{method,headers,body:JSON.stringify(getPayload())});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    const newBin = d?.metadata?.id || bin;
    S.jbKey=key; S.jbBin=newBin;
    DB.s('jbKey',key); DB.s('jbBin',newBin);
    if(document.getElementById('jb-bin')) document.getElementById('jb-bin').value=newBin;
    cloudLog2('ok',`✅ Sauvegardé — Bin: ${newBin}`);
    updateCloudDot('ok');
    notify('Sauvegarde cloud réussie ☁️','success');
  }catch(e){
    cloudLog2('err',`❌ ${e.message.slice(0,50)}`);
    updateCloudDot('err');
  }
}

async function cloudLoad(){
  const key=(document.getElementById('jb-key')?.value||'').trim();
  const bin=(document.getElementById('jb-bin')?.value||'').trim();
  if(!key||!bin){cloudLog2('err','❌ Clé + Bin ID requis');return;}
  if(!confirm('Restaurer depuis le cloud ? Données locales écrasées.')) return;
  cloudLog2('info','Chargement…');
  try{
    const res = await fetch(`${JBURL}/b/${bin}/latest`,{
      headers:{'X-Master-Key':key,'X-Bin-Meta':false}
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    const d = raw.record || raw;
    if(d.profil) S.profil=d.profil;
    if(d.yr) S.yr=d.yr; if(d.wk) S.wk=d.wk;

async function cloudTest(){
  const key=(document.getElementById('jb-key')?.value||'').trim();
  if(!key){cloudLog2('err','❌ Entrez votre clé API');return;}
  cloudLog2('info','Test connexion…');
  try{
    const res = await fetch(`${JBURL}/b`,{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Master-Key':key,
        'X-Bin-Name':'nadhir-test','X-Bin-Private':'true'},
      body:JSON.stringify({test:true,ts:Date.now()})
    });
    if(res.ok||res.status===201){
      const d=await res.json();
      const id=d?.metadata?.id;
      S.jbKey=key; if(id) S.jbBin=id;
      DB.s('jbKey',key); if(id) DB.s('jbBin',id);
      if(document.getElementById('jb-bin')&&id) document.getElementById('jb-bin').value=id;
      cloudLog2('ok',`✅ Clé valide ! Bin test: ${id}`);
      updateCloudDot('ok');
    } else throw new Error(`HTTP ${res.status}`);
  }catch(e){cloudLog2('err',`❌ Clé invalide: ${e.message.slice(0,40)}`);}
}

function cloudLog2(type, msg){
  const el = document.getElementById('cloud-log'); if(!el) return;
  const ts = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const line = document.createElement('div');
  line.className = `log-${type}`;
  line.textContent = `[${ts}] ${msg}`;
  el.insertBefore(line,el.firstChild);
  while(el.children.length>6) el.removeChild(el.lastChild);
}

// ── TOAST ──
let notifTimer;
function notify(msg, type='success'){
  const el=document.getElementById('notif');
  const ni=document.getElementById('ni');
  const nt=document.getElementById('nt');
  if(!el||!ni||!nt) return;
  ni.textContent = type==='success'?'✅':type==='warn'?'⚡':type==='error'?'❌':'ℹ️';
  nt.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(notifTimer);
  notifTimer = setTimeout(()=>el.className='', 2800);
}

// ── TIMER ENGINE ──
let timerInterval, timerSec=0, timerDur=0;
let currentTimerEx = '';

function startTimer(sec, exName=''){
  clearInterval(timerInterval);
  timerSec=sec; timerDur=sec; currentTimerEx=exName;
  document.getElementById('timer-ov').classList.add('show');
  document.getElementById('t-lbl').textContent='REPOS';
  document.getElementById('t-ex').textContent=exName||'—';
  document.getElementById('t-num').classList.remove('urgent');
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timerSec--;
    if(timerSec<=0){
      clearInterval(timerInterval);
      document.getElementById('t-num').textContent='GO! 🔥';
      document.getElementById('t-pf').style.width='0%';
      if('vibrate' in navigator) navigator.vibrate([150,80,150,80,250]);
      setTimeout(closeTimer, 1800);
    } else {
      updateTimerDisplay();
      if(timerSec<=5) document.getElementById('t-num').classList.add('urgent');
    }
  },1000);
}

function updateTimerDisplay(){
  document.getElementById('t-num').textContent=fmt(timerSec);
  document.getElementById('t-pf').style.width=(timerSec/timerDur*100)+'%';
}
function addTime(s){ timerSec=Math.max(1,timerSec+s); }
function closeTimer(){ clearInterval(timerInterval); document.getElementById('timer-ov').classList.remove('show'); }

// ── SNC SAVE ──
function saveSNC(){
  const s1=parseFloat(document.getElementById('s1').value)||0;
  const s2=parseFloat(document.getElementById('s2').value)||0;
  const s3=parseFloat(document.getElementById('s3').value)||0;
  const slp=parseFloat(document.getElementById('sleep').value)||0;
  if(!s1||!s2||!s3){notify('Entre les 3 sauts','warn');return;}
  const existing = S.snc.findIndex(x=>x.date===td());
  const entry = {date:td(),s1,s2,s3,sleep:slp};
  if(existing>=0) S.snc[existing]=entry; else S.snc.push(entry);
  if(S.snc.length>90) S.snc=S.snc.slice(-90);
  save();
  const moy=(s1+s2+s3)/3;
  const m7=sncMoy7();
  const ratio=m7?Math.round(moy/m7*100):100;
  document.getElementById('snc-result').innerHTML=
    `Moy aujourd'hui: <strong>${moy.toFixed(1)}cm</strong><br>Moyenne 7j: <strong>${m7?m7.toFixed(1):moy.toFixed(1)}cm</strong><br>Ratio SNC: <strong style="color:${ratio>=90?'var(--g)':ratio>=85?'var(--a)':'var(--r)'}">${ratio}%</strong><br>Sommeil: <strong>${slp?slp+'h':'—'}</strong>`;
  const dot=document.getElementById('snc-dot');
  dot.className='tc-dot';
  if(ratio>=90) dot.classList.add('green');
  else if(ratio>=85) dot.style.background='var(--a)';
  else dot.style.background='var(--r)';
  document.getElementById('snc-val').textContent=ratio+'%';
  renderToday();
  notify('SNC enregistré ✓','success');
}

    <button class="btn btn-g btn-full" onclick="saveTest()">💾 Enregistrer test</button>
  </div>`;

  // === HISTORIQUE TESTS ===
  if(S.tests.length > 0){
    h += `<div class="card">
      <div class="ct"><span class="ico">📜</span>HISTORIQUE DES TESTS</div>`;
    S.tests.slice(-8).reverse().forEach(t=>{
      h += `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);">

          ${t.bd?`<span style="color:var(--r)">${t.bd}</span>`:''}
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  // ── Trajectoire cibles annuelles ──
  h += `<div class="card cb">
    <div class="ct"><span class="ico">🎯</span>TRAJECTOIRE SCIENTIFIQUE 2025–2031</div>`;

  // Récupérer derniers tests
  const lastTs = [...(S.tests||[])].reverse();
  const lSprint  = lastTs.find(t=>t.sprint)?.sprint;
  const lDetente = lastTs.find(t=>t.detente)?.detente;
  const lBd      = lastTs.find(t=>t.bd!==undefined)?.bd;

  TRAJECTOIRE.sprint.forEach((t,i)=>{
    const yr = i+1;
    const isCur = yr===S.yr;
    const isPast = yr<S.yr;
    const dtCible = TRAJECTOIRE.detente[i].cible;
    const bdCible = TRAJECTOIRE.bd[i].cible;
    const spOk = lSprint ? lSprint<=t.cible : null;
    const dtOk = lDetente ? lDetente>=dtCible : null;
    h += '<div class="tl-item"><div class="tl-dot '+(isCur?'':'a')+(isPast?' dim':'')+'"></div>';
    h += '<div class="tl-yr">'+(isCur?'▶ ':'')+'AN '+yr+(isPast?' ✓':'')+'</div>';
    h += '<div class="tl-title" style="color:'+(isCur?'var(--g)':isPast?'var(--t3)':'var(--t)')+'">'+MACROS[i].label+'</div>';
    h += '<div class="tl-sub">🏃 '+t.cible+'s &nbsp;🦘 '+dtCible+'cm &nbsp;🤼 '+(bdCible>0?bdCible+'%':'intro')+'</div>';
    if(isCur && (lSprint||lDetente)){
      const adj = getAdjustedVolumes(yr);
      if(adj.message.length){
        h += '<div style="margin-top:4px;font-size:9px;">';
        adj.message.forEach(m=>{ h+='<div style="color:var(--a);">'+m+'</div>'; });
        h += '</div>';
      }
    }
    h += '</div>';
  });
  h += `</div>`;

  document.getElementById('tab-goals').innerHTML=h;
}

function saveTest(){

function generateCoachMsgs(macro, sw, meso, dec){
  const msgs = [];
  const ratio=dec.ratio;
  const sprint=S.profil.sprint;
  const det=S.profil.detente;

  if(!sprint&&!det){
    msgs.push({cls:'cm-warn',text:'📊 <strong>Aucun test enregistré.</strong> Va dans Objectifs → Enregistrer un test pour que le coach adapte les recommandations à ton niveau réel.'});
  } else {
    const sprintOk = sprint && sprint <= macro.sprint*1.02;
    const detOk = det && det >= macro.det*0.98;
    if(sprintOk) msgs.push({cls:'',text:`✅ <strong>Sprint ${sprint}s</strong> — dans les clous pour An ${S.yr} (cible: ${macro.sprint}s). Continue sur cette progression.`});
    else if(sprint) msgs.push({cls:'cm-warn',text:`⚡ <strong>Sprint ${sprint}s</strong> vs cible An ${S.yr}: ${macro.sprint}s — déficit. Augmente le volume Vmax et les départs en semaines non-décharge.`});
    if(detOk) msgs.push({cls:'',text:`✅ <strong>Détente ${det}cm</strong> — dans les clous (cible: ${macro.det}cm). Maintiens drop jumps et force squat.`});
    else if(det) msgs.push({cls:'cm-warn',text:`⚡ <strong>Détente ${det}cm</strong> vs cible An ${S.yr}: ${macro.det}cm — déficit. Focus RSI: drop jumps ${getPlioBox(S.yr)}cm, squat lourd.`});
  }

  if(sw===8) msgs.push({cls:'cm-warn',text:'⚡ <strong>Semaine de décharge obligatoire (S8/8).</strong> Sprint −30%, plio −40%, charges 65%. Ce n\'est PAS optionnel — c\'est quand les adaptations se consolident.'});
  if(meso.ph==='pic') msgs.push({cls:'',text:`🚀 <strong>Phase INTENSIFICATION.</strong> Volume réduit, qualité maximale. C'est maintenant que tu exprimes les gains des 6 semaines passées.`});

  if(ratio!==null && ratio<0.90) msgs.push({cls:'cm-bad',text:`⚠️ <strong>SNC critique (${Math.round(ratio*100)}%).</strong> Sprint et pliométrie automatiquement réduits. Priorité récupération aujourd'hui.`});

  msgs.push({cls:'',text:`📅 <strong>An ${S.yr}/8 — Semaine ${S.wk}.</strong> ${macro.focus[0]}. Objectifs de l'année: sprint ${macro.sprint}s · détente ${macro.det}cm · squat ${macro.sq}kg.`});
  return msgs;
}

function getBDAdvice(phase, sw){
  const advice={
    intro:'Semaine de prise en main. Focus: wrist curl léger + pronation douce. Appren la position de table, le cupping, et la relaxation du poignet. Aucune charge lourde avant 4 semaines.',
    dev:'Phase développement. Curl marteau lourd (4×6 à 80%), pronation câble progressive. Commence l\'isométrie table: 5×5s effort modéré. Chaque semaine +2.5% charge.',
    force:'Bloc force. Isométrie table 80%+ effort max, pronation lourde. Simulation match vs partenaire 15–20 min/sam. Technique top-roll prioritaire.',
    intense:'Bloc intensif. 2× BD/semaine (hiver). Isométrie + match sim intense. Travaille les finitions: passage de la position haute à la pin. Récupération coudes stricte.',
    peak:'Bloc compétitif. Teste-toi contre ton frère régulièrement. Analyse ses faiblesses: a-t-il un hook ou un top-roll? Exploite la technique vs sa masse.',
    maintain:'Maintien BD. 1 séance technique/semaine. Conserve la force acquise sans surentraîner les coudes.',

  return advice[phase]||advice.intro;
}

function saveProfil(){
  S.profil.poids=parseFloat(document.getElementById('p-poids')?.value)||S.profil.poids;
  S.profil.taille=parseInt(document.getElementById('p-taille')?.value)||S.profil.taille;
  S.profil.age=parseInt(document.getElementById('p-age')?.value)||S.profil.age;
  S.profil.squat1RM=parseFloat(document.getElementById('p-sq')?.value)||S.profil.squat1RM;
  S.profil.rdl1RM=parseFloat(document.getElementById('p-rdl')?.value)||S.profil.rdl1RM;
  S.profil.traction=parseFloat(document.getElementById('p-tr')?.value)||0;
  S.profil.curl3RM=parseFloat(document.getElementById('p-curl')?.value)||S.profil.curl3RM;
  const sd=document.getElementById('p-startDate')?.value;
  if(sd) S.profil.startDate=sd;
  const yrRaw=(document.getElementById('p-yr')?.value||'').trim();
  const wkRaw=(document.getElementById('p-wk')?.value||'').trim();
  S._manualYr=yrRaw?parseInt(yrRaw):null;
  S._manualWk=wkRaw?parseInt(wkRaw):null;
  if(isAutoMode()){
    const yw=calcYrWk(); S.yr=yw.yr; S.wk=yw.wk;
    if(yw.hivAuto && S.mode!=='hiv') S.mode='hiv';
    else if(!yw.hivAuto && S.mode==='hiv') S.mode='std';
  } else {
    if(S._manualYr) S.yr=S._manualYr;
    if(S._manualWk) S.wk=S._manualWk;
  }
  save();
  notify('Profil sauvegardé ✓ '+(isAutoMode()?'— AUTO 📅':'— Manuel ⚙️'),'success');
  renderProfile(); renderToday();
}

function exportData(){
  const b=new Blob([JSON.stringify(getPayload(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`nadhir-elite-${td()}.json`;a.click();URL.revokeObjectURL(a.href);
  notify('Export réussi ✓','success');
}
function importData(input){
  if(!input.files.length) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.profil) S.profil=d.profil;
      if(d.yr) S.yr=d.yr; if(d.wk) S.wk=d.wk;
      if(d.snc) S.snc=d.snc; if(d.sessions) S.sessions=d.sessions;
      if(d.tests) S.tests=d.tests;
      save(); location.reload();
    }catch(err){notify('Fichier invalide ❌','error');}
  };
  r.readAsText(input.files[0]);
}

(function init(){
  // Sync cloud dot state
  if(S.jbKey && S.jbBin) updateCloudDot('ok');

  const ratio = sncRatio();
  if(ratio !== null){
    const dot=document.getElementById('snc-dot');

    dot.className='tc-dot';

  if(isAutoMode()){
    const yw=calcYrWk(); S.yr=yw.yr; S.wk=yw.wk;
    if(yw.hivAuto && S.mode!=='hiv') S.mode='hiv';
    else if(!yw.hivAuto && S.mode==='hiv') S.mode='std';
    save();
  }
  renderToday();
  (function schedMidnight(){
    const now=new Date(), next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,3);
    setTimeout(()=>{
      if(isAutoMode()){
        const yw=calcYrWk(); S.yr=yw.yr; S.wk=yw.wk;
        if(yw.hivAuto&&S.mode!=='hiv') S.mode='hiv';
        else if(!yw.hivAuto&&S.mode==='hiv') S.mode='std';
        save();
      }
      renderToday(); schedMidnight();
    }, next-now);
  })();
})();
</script>
